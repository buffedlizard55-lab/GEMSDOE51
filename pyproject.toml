[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems51"
version = "0.1.0"
description = "Two-stage strain-budget-constrained fault discovery for the DOE GEMS Prize (DrivenData #306)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "rasterio", "scikit-learn", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
