name: Official fault source audit
on:
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official INGENIOUS v2 archive and geodetic metadata
        run: |
          mkdir -p official
          curl --fail --location --retry 3 --max-time 300 https://gdr.openei.org/files/1391/qfaults_ingenious_nad83conus117_2023-06-27.zip -o official/qfaults.zip
          curl --fail --location --retry 3 --max-time 300 https://gdr.openei.org/files/1391/geodetics_INGENIOUS_regional_data.zip -o official/geodetics.zip
          sha256sum official/*.zip > official/SHA256SUMS
          unzip -l official/qfaults.zip > official/qfaults_inventory.txt
          unzip -l official/geodetics.zip > official/geodetics_inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-audit
          path: official/
          retention-days: 30
      - name: Extract small auditable source records
        run: |
          python -m pip install pyshp pyproj
          mkdir -p registry/official
          python - <<'PY'
          import zipfile, pathlib, shapefile, json, hashlib, csv
          root = pathlib.Path('registry/official')
          receipt = {}
          for stem in ('qfaults', 'geodetics'):
              path = pathlib.Path('official') / (stem + '.zip')
              with zipfile.ZipFile(path) as z:
                  receipt[stem] = {'sha256':hashlib.sha256(path.read_bytes()).hexdigest(), 'bytes':path.stat().st_size, 'members':z.namelist()}
                  for i, name in enumerate(z.namelist()):
                      if name.lower().endswith(('.txt','.xml','.prj')) and z.getinfo(name).file_size < 2_000_000:
                          (root / (stem + '_' + str(i) + '_' + pathlib.Path(name).name)).write_bytes(z.read(name))
                  if stem == 'qfaults':
                      name = next(n for n in z.namelist() if n.lower().endswith('.dbf'))
                      import io
                      r = shapefile.Reader(dbf=io.BytesIO(z.read(name)))
                      receipt[stem]['fields'] = r.fields[1:]
                      receipt[stem]['records'] = len(r)
                      with (root/'qfault_attributes.csv').open('w') as f:
                          w=csv.writer(f); w.writerow([x[0] for x in r.fields[1:]]); w.writerows(r.records())
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Extract regional trace geometry
        run: python scripts/extract_official_segments.py
      - name: Preserve source metadata on the session branch
        if: github.ref == 'refs/heads/arena/4df01627-gemsdoe51'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/official
          git diff --cached --quiet || git commit -m 'Record official fault attributes and geodetic metadata from GDR'
          git push origin HEAD:arena/4df01627-gemsdoe51
