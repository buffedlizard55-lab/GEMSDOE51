name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pandas rasterio pytest
      - name: Compile current Python sources
        run: python -m compileall -q scripts src tests
      - name: Unit tests
        run: pytest tests -q
      - name: Regenerate current site
        run: python scripts/build_site.py
      - name: Check links and current download state
        run: python scripts/check_site.py
      - name: Fail if the committed site is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ changed when regenerated — commit the regenerated site"
            git diff --stat -- docs
            exit 1
          fi
