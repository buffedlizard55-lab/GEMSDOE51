name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn scikit-image pandas rasterio pytest
      - name: Format contract of the research-only raster (not an upload recommendation)
        run: python scripts/check_submission.py docs/downloads/gemsdoe51-hg-hd-xing-exp-r347-20261007T034048Z-nan.tif
      - name: Verify new P1 research artifact (never an upload recommendation)
        run: python scripts/verify_p1_artifact.py
      - name: Compile current Python sources
        run: python -m compileall -q scripts src tests
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Regenerate current site
        run: python scripts/build_site.py
      - name: Check links and current download state
        run: python scripts/check_site.py
      - name: Check API drift, imports, test collection, and generated links
        run: python scripts/check_repo_health.py --json /tmp/repo_health.json
      - name: Fail if the committed site is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ changed when regenerated — commit the regenerated site"
            git diff --stat -- docs
            exit 1
          fi
